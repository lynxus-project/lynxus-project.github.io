name: Deploy documentation site

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      lynxus_ref:
        description: Lynxus branch, tag, or commit to document
        required: true
        default: main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site source
        uses: actions/checkout@v4
      - name: Checkout Lynxus documentation source
        uses: actions/checkout@v4
        with:
          repository: lynxus-project/lynxus
          ref: ${{ inputs.lynxus_ref || 'main' }}
          path: lynxus-source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify canonical example
        working-directory: lynxus-source
        run: |
          mvn -pl lynxus-processor -am -DskipTests install
          mvn -pl lynxus-examples/basic-mapper -am -DskipTests compile
      - name: Check lockfile registry
        run: |
          if grep -qE 'mirrors\.cloud\.tencent\.com|registry\.npmmirror\.com' package-lock.json; then
            echo "::error file=package-lock.json::Resolve tarballs from registry.npmjs.org; runners cannot reach this mirror reliably."
            exit 1
          fi
      - run: npm ci
      - name: Build static site
        env:
          LYNXUS_SOURCE_DIR: ${{ github.workspace }}/lynxus-source
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
